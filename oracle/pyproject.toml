[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "providence-oracle"
version = "0.1.0"
description = "Providence Cloud Agent — AWS VPC Flow Log & CloudTrail Ingestion"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "pandas>=2.1",
    "schedule>=1.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
