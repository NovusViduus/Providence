spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/providence
    username: ${DB_USER:providence}
    password: ${DB_PASS:providence}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

grpc:
  server:
    port: 50051

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.providence.citadel: INFO
    io.grpc: WARN

providence:
  firewall:
    platform: noop  # pfctl | iptables | noop
  expiry:
    sweep-interval-ms: 30000
  ai-detection:
    ml-url: http://localhost:50052/ml/ai-detect
    min-events: 10
    confidence-threshold: 0.8
    sweep-interval-ms: 60000
