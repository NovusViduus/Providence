[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "providence-ml"
version = "0.1.0"
description = "Providence ML Classification Service"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "protobuf>=4.25",
    "joblib>=1.3",
    "torch>=2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "ruff>=0.3",
]
notebook = [
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
